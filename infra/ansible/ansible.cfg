[defaults]
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
display_args_to_stdout = False
interpreter_python = auto_silent
forks = 1
timeout = 30
# The wrapper (infra/lib/ansible.sh) sets the inventory, user, key and the dedicated known_hosts.

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ControlMaster=auto -o ControlPersist=60s
